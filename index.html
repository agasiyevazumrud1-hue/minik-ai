<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>MINIK AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d19;color:#f4f7ff;font:15px/1.6 system-ui,sans-serif}
.app{max-width:850px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:15px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px}
.logo{background:linear-gradient(135deg,#a99aff,#65e5d2);color:#101426;padding:10px 15px;border-radius:15px;font-size:22px;font-weight:bold}
h2{margin:0;font-size:20px}small{color:#9ba8c7}
button{cursor:pointer;border:0;border-radius:12px;padding:11px;background:#252d4a;color:white}
button:hover{filter:brightness(1.2)}button:disabled{opacity:.5;cursor:wait}
#welcome{text-align:center;margin:auto;padding:35px 0}
#welcome .star{font-size:55px;color:#a99aff}
h1{font-size:clamp(28px,7vw,42px)}
.gradient{background:linear-gradient(90deg,#b9aaff,#65e5d2);color:transparent;background-clip:text}
#chat{display:flex;flex-direction:column;gap:16px;padding:12px 0 25px}
.msg{padding:12px 15px;border-radius:17px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;animation:appear .2s ease}
.user{align-self:flex-end;background:#252d4a;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#151e32;border:1px solid #ffffff12;border-bottom-left-radius:4px}
.composer{position:sticky;bottom:0;background:#090d19;padding:12px 0 calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px}
textarea{flex:1;resize:none;min-width:0;max-height:140px;background:#151e32;border:1px solid #343b58;border-radius:16px;color:white;padding:13px;font:inherit;outline:none}
#send{background:linear-gradient(135deg,#a99aff,#65e5d2);color:#0b1020;font-size:20px;font-weight:bold;min-width:48px}
#settings{background:#151e32;border:1px solid #ffffff18}
input{width:100%;padding:12px;margin:8px 0 14px;background:#090d19;border:1px solid #343b58;border-radius:10px;color:white}
#panel{display:none;background:#151e32;padding:16px;border-radius:16px;margin-bottom:12px}
#panel label{display:block;color:#b8c4df}.note{font-size:12px;color:#9ba8c7}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
<header><div style="display:flex;gap:11px;align-items:center"><div class="logo">M</div><div><h2>MINIK AI</h2><small>✦ Sənin ağıllı köməkçin</small></div></div><button id="settings" type="button">⚙</button></header>
<section id="panel">
<label for="api">Gemini API açarı</label><input id="api" type="password" autocomplete="off" placeholder="Gemini API açarını daxil et">
<label for="model">Model</label><input id="model" value="gemini-3.8-flash">
<button id="save" type="button">Yadda saxla</button> <button id="clear" type="button">Söhbəti sil</button>
<p class="note">API açarı bu brauzerin yaddaşında saxlanır. İctimai saytda bu tam təhlükəsiz deyil. Açarını heç kimlə paylaşma.</p>
</section>
<section id="welcome"><div class="star">✦</div><h1>Salam! Mən <span class="gradient">MINIK AI</span></h1><p style="color:#9ba8c7">Nə öyrənmək və ya yaratmaq istəyirsən?</p>
<button class="ask" type="button">Mənə HTML oyunu yaz</button> <button class="ask" type="button">Python-u izah et</button> <button class="ask" type="button">Vikipediyada pişiklər haqqında axtar</button></section>
<div id="chat"></div>
<form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="MINIK AI-yə mesaj yaz..."></textarea><button id="send" type="submit">➤</button></form>
<small style="text-align:center">MINIK AI səhv edə bilər. Vacib məlumatları yoxla.</small>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const chat = $('chat'), welcome = $('welcome'), promptBox = $('prompt');
const HISTORY = 'minik_history_v3';
let history = [], busy = false;
$('api').value = localStorage.getItem('minik_api_key') || '';
$('model').value = localStorage.getItem('minik_model') || 'gemini-3.8-flash';

function add(role, text) {
  welcome.style.display = 'none';
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  bubble.textContent = text;
  chat.appendChild(bubble);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  return bubble;
}
function saveHistory() {
  try { localStorage.setItem(HISTORY, JSON.stringify(history.slice(-30))); } catch(e) {}
}
function renderHistory() {
  history.forEach(m => add(m.role === 'user' ? 'user' : 'ai', m.content));
  if (history.length) welcome.style.display = 'none';
}
try {
  const old = JSON.parse(localStorage.getItem(HISTORY) || '[]');
  if (Array.isArray(old)) history = old.filter(m => m && typeof m.content === 'string' && ['user','model'].includes(m.role)).slice(-30);
  renderHistory();
} catch(e) { history = []; }

$('settings').addEventListener('click', () => {
  $('panel').style.display = $('panel').style.display === 'block' ? 'none' : 'block';
});
$('save').addEventListener('click', () => {
  const key = $('api').value.trim();
  if (!key) { alert('Gemini API açarını daxil et.'); return; }
  localStorage.setItem('minik_api_key', key);
  localStorage.setItem('minik_model', $('model').value.trim() || 'gemini-3.8-flash');
  alert('Parametrlər yadda saxlanıldı.');
});
$('clear').addEventListener('click', () => {
  history = []; chat.innerHTML = ''; localStorage.removeItem(HISTORY);
  welcome.style.display = ''; alert('Söhbət silindi.');
});

async function wiki(query) {
  const url = 'https://az.wikipedia.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(query) + '&format=json&origin=*&srlimit=3';
  const response = await fetch(url);
  if (!response.ok) throw new Error('Vikipediya bağlantısı alınmadı.');
  const data = await response.json();
  return (data.query?.search || []).map(x =>
    x.title + ': ' + x.snippet.replace(/<[^>]*>/g, '') +
    ' — https://az.wikipedia.org/wiki/' + encodeURIComponent(x.title.replace(/ /g, '_'))
  ).join('\n');
}
async function askGemini(contents) {
  const key = localStorage.getItem('minik_api_key');
  const model = localStorage.getItem('minik_model') || 'gemini-3.8-flash';
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent';
  for (let attempt = 0; attempt < 3; attempt++) {
    let response;
    try {
      response = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({
          systemInstruction:{parts:[{text:'Sən MINIK AI adlı mehriban və faydalı köməkçisən. Azərbaycan dilində cavab ver. Bilmədiyini uydurma. Kod istənəndə aydın, işlək kod yaz. Vikipediya nəticələri veriləndə mənbəni göstər.'}]},
          contents,
          generationConfig:{thinkingConfig:{thinkingLevel:'LOW'}}
        })
      });
    } catch(e) {
      if (attempt === 2) throw new Error('İnternet bağlantısını yoxla.');
      await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
      continue;
    }
    if (response.ok) return response.json();
    const data = await response.json().catch(() => ({}));
    if ([429,500,502,503,504].includes(response.status) && attempt < 2) {
      await new Promise(resolve => setTimeout(resolve, 700 * 2 ** attempt));
      continue;
    }
    throw new Error(data.error?.message || 'Gemini xətası: ' + response.status);
  }
  throw new Error('Yenidən cəhd et.');
}
function fastText(bubble, text) {
  bubble.textContent = '';
  let index = 0;
  const step = Math.max(5, Math.ceil(text.length / 100));
  function tick() {
    index = Math.min(text.length, index + step);
    bubble.textContent = text.slice(0, index);
    if (index < text.length) requestAnimationFrame(tick);
  }
  tick();
}
async function sendMessage(text) {
  text = text.trim();
  if (!text || busy) return;
  const key = localStorage.getItem('minik_api_key');
  if (!key) { $('panel').style.display = 'block'; alert('Əvvəl Gemini API açarını əlavə et.'); return; }
  busy = true; $('send').disabled = true; promptBox.disabled = true;
  add('user', text);
  history.push({role:'user', content:text}); saveHistory();
  const bubble = add('ai', '● ● ●');
  try {
    let extra = '';
    if (/^(\/wiki\s+|vikipediyada\s+|wikipedia\s+)/i.test(text)) {
      const query = text.replace(/^(\/wiki\s+|vikipediyada\s+|wikipedia\s+)/i, '').trim();
      if (query) {
        const result = await wiki(query);
        extra = result ? 'Vikipediya nəticələri:\n' + result : 'Vikipediyada nəticə tapılmadı.';
      }
    }
    const contents = history.slice(-20).map(m => ({role:m.role, parts:[{text:m.content}]}));
    if (extra) contents.push({role:'user', parts:[{text:extra + '\nBu məlumat əsasında sualı cavabla: ' + text}]});
    const data = await askGemini(contents);
    const answer = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
    if (!answer) throw new Error('Boş cavab alındı. Modeli və API limitini yoxla.');
    history.push({role:'model', content:answer}); saveHistory();
    fastText(bubble, answer);
  } catch(error) {
    bubble.textContent = 'Xəta: ' + error.message;
    history.pop(); saveHistory();
  } finally {
    busy = false; $('send').disabled = false; promptBox.disabled = false; promptBox.focus();
  }
}
$('form').addEventListener('submit', event => {
  event.preventDefault();
  const text = promptBox.value;
  promptBox.value = ''; promptBox.style.height = 'auto';
  sendMessage(text);
});
promptBox.addEventListener('input', () => {
  promptBox.style.height = 'auto';
  promptBox.style.height = Math.min(promptBox.scrollHeight, 140) + 'px';
});
promptBox.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('form').requestSubmit(); }
});
document.querySelectorAll('.ask').forEach(button => {
  button.addEventListener('click', () => {
    promptBox.value = button.textContent;
    $('form').requestSubmit();
  });
});
</script>
</body>
</html>
