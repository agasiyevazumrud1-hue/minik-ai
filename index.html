
<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b18">
<title>MINIK AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b18;color:#f5f6ff;font:16px system-ui;min-height:100vh}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303653}
h1{margin:0;font-size:23px;color:#9e9cff}
button{border:0;border-radius:12px;padding:12px;background:#777cff;color:white;font-size:15px}
main{max-width:760px;margin:auto;padding:16px}
#welcome{text-align:center;padding:32px 5px}
#welcome h2{font-size:29px}
#chat{display:flex;flex-direction:column;gap:12px;padding-bottom:15px}
.msg{padding:13px 15px;border-radius:15px;background:#171d36;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#29254a;align-self:flex-end;max-width:90%}
.bot{align-self:stretch}
form{position:sticky;bottom:0;background:#090b18;padding:10px 0;display:flex;gap:8px}
textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:140px;border:1px solid #414a70;border-radius:14px;background:#151a30;color:white;padding:13px;font:inherit}
#send{min-width:58px}
#status{font-size:12px;color:#aeb8dc;padding:6px 0}
#settingsPanel{display:none;padding:15px;background:#171d36;border-radius:15px;margin:12px 0}
#settingsPanel input{width:100%;padding:12px;margin:6px 0 12px;border-radius:10px;border:1px solid #414a70;background:#090b18;color:white}
small{color:#b3bbd8}
</style>
</head>
<body>
<header>
  <h1>MINIK AI ✦</h1>
  <button id="settings">⚙ Ayarlar</button>
</header>
<main>
  <section id="welcome">
    <h2>Salam! Mən MINIK AI-yam 👋</h2>
    <p>Sualını yaz, birlikdə həll edək.</p>
  </section>

  <section id="settingsPanel">
    <label for="apiKey">Gemini API açarı</label>
    <input id="apiKey" type="password" placeholder="AIza...">
    <label for="model">Model adı</label>
    <input id="model" value="gemini-3.8-flash">
    <button id="save">Yadda saxla</button>
    <p><small>Açarı heç kimlə paylaşma və açıq kodda yerləşdirmə.</small></p>
  </section>

  <div id="status">API açarını ayarlardan əlavə et.</div>
  <section id="chat" aria-live="polite"></section>

  <form id="form">
    <textarea id="prompt" placeholder="MINIK AI-yə mesaj yaz..." required></textarea>
    <button id="send" type="submit">➤</button>
  </form>
</main>
<script>
const $=id=>document.getElementById(id);
let history=[];
let busy=false;

$('settings').onclick=()=>{
  $('apiKey').value=localStorage.getItem('minik_api_key')||'';
  $('model').value=localStorage.getItem('minik_model')||'gemini-3.8-flash';
  $('settingsPanel').style.display=
    $('settingsPanel').style.display==='block'?'none':'block';
};

$('save').onclick=()=>{
  const key=$('apiKey').value.trim();
  const model=$('model').value.trim();
  if(!key){$('status').textContent='API açarını daxil et.';return;}
  if(!model){$('status').textContent='Model adını daxil et.';return;}
  localStorage.setItem('minik_api_key',key);
  localStorage.setItem('minik_model',model);
  $('settingsPanel').style.display='none';
  $('status').textContent='Açar saxlanıldı. İndi mesaj göndər.';
};

function addMessage(text,who){
  const el=document.createElement('div');
  el.className='msg '+who;
  el.textContent=text;
  $('chat').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
  return el;
}

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  if(busy)return;
  const text=$('prompt').value.trim();
  if(!text)return;

  const key=localStorage.getItem('minik_api_key');
  const model=localStorage.getItem('minik_model')||'gemini-3.8-flash';
  if(!key){
    $('settingsPanel').style.display='block';
    $('status').textContent='Əvvəl Gemini API açarını əlavə et.';
    return;
  }

  $('welcome').style.display='none';
  $('prompt').value='';
  addMessage(text,'user');
  const answerBox=addMessage('MINIK AI düşünür…','bot');
  history.push({role:'user',parts:[{text}]});
  busy=true;
  $('send').disabled=true;
  $('status').textContent='Gemini-yə qoşulur…';

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),30000);

  try{
    const response=await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/'+
      encodeURIComponent(model)+':generateContent',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-goog-api-key':key
        },
        signal:controller.signal,
        body:JSON.stringify({
          systemInstruction:{parts:[{text:
            'Sən MINIK AI adlı mehriban və faydalı köməkçisən. '+
            'İstifadəçinin dilində cavab ver, Azərbaycan dilinə üstünlük ver. '+
            'Aydın və düzgün cavablar yaz.'}]},
          contents:history,
          generationConfig:{maxOutputTokens:800,temperature:0.7}
        })
      }
    );

    const data=await response.json();
    if(!response.ok){
      throw new Error(data.error?.message||'HTTP '+response.status);
    }

    const answer=(data.candidates?.[0]?.content?.parts||[])
      .map(p=>p.text||'').join('').trim();

    if(!answer)throw new Error('Model boş cavab qaytardı.');
    answerBox.textContent=answer;
    history.push({role:'model',parts:[{text:answer}]});
    $('status').textContent='Cavab hazırdır ✓';

  }catch(err){
    history.pop();
    answerBox.textContent=err.name==='AbortError'
      ?'Sorğu 30 saniyəyə cavab vermədi. İnterneti və modelin əlçatanlığını yoxla.'
      :'Xəta: '+err.message+
        '\n\nƏgər Failed to fetch yazılırsa, Chrome bağlantını bloklaya bilər. HTTPS saytını açdığını və interneti yoxla.';
    $('status').textContent='Sorğu uğursuz oldu.';
  }finally{
    clearTimeout(timeout);
    busy=false;
    $('send').disabled=false;
  }
});
</script>
</body>
</html>
